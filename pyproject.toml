[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pengram"
version = "0.1.0"
description = "Parse. Extract. Normalize. Knowledge graphs from raw content."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Penfield" }]
keywords = ["knowledge-graph", "entity-extraction", "obsidian", "penfield"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
code = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.9,<1.0",
]
video = [
    "faster-whisper>=1.0",
    "yt-dlp>=2024.1.1,<2027",
]
youtube = [
    "yt-dlp>=2024.1.1,<2027",
]
watch = [
    "watchdog>=4.0",
]
openai = [
    "openai>=1.0",
]
openrouter = [
    "openai>=1.0",
]
pdf = [
    "pypdf>=4.0",
]
epub = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
]
clustering = [
    "graspologic>=3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    # Optional runtime deps are also installed for dev/CI so the test
    # suite runs with zero skips. See ARCHITECTURE.md > Testing strategy.
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.9,<1.0",
    "pypdf>=4.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "watchdog>=4.0",
    "pyyaml>=6.0",
]
all = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.9,<1.0",
    "faster-whisper>=1.0",
    "yt-dlp>=2024.1.1,<2027",
    "openai>=1.0",
    "pypdf>=4.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "watchdog>=4.0",
    "graspologic>=3.0",
]

[project.scripts]
pengram = "pengram.__main__:main"

[project.urls]
Homepage = "https://github.com/penfieldlabs/pengram"
Repository = "https://github.com/penfieldlabs/pengram"
Issues = "https://github.com/penfieldlabs/pengram/issues"

[tool.setuptools.packages.find]
include = ["pengram*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
pengram = ["vocabulary/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
